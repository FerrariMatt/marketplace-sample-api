default: &default
  adapter: postgresql
  encoding: unicode
  max_connections: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>


development:
  <<: *default
  database: sample_marketplace_api_development
  host: localhost
  port: 5432
  username: ferrari
  password: 31415

test:
  <<: *default
  database: sample_marketplace_api_test
  host: localhost
  port: 5432
  username: ferrari
  password: 31415


production:
  primary: &primary_production
    <<: *default
    database: sample_marketplace_api_production
    username: sample_marketplace_api
    password: <%= ENV["SAMPLE_MARKETPLACE_API_DATABASE_PASSWORD"] %>
  cache:
    <<: *primary_production
    database: sample_marketplace_api_production_cache
    migrations_paths: db/cache_migrate
  queue:
    <<: *primary_production
    database: sample_marketplace_api_production_queue
    migrations_paths: db/queue_migrate
  cable:
    <<: *primary_production
    database: sample_marketplace_api_production_cable
    migrations_paths: db/cable_migrate
